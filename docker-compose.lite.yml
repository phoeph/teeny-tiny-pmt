# 轻量级 Docker Compose 配置
# 适用于资源受限的服务器
# 使用方法: docker-compose -f docker-compose.lite.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: pmt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pmt-network
    # 资源限制 - MySQL
    deploy:
      resources:
        limits:
          cpus: '1.0'      # 限制最多使用 1 个 CPU 核心
          memory: 512M     # 限制最多使用 512MB 内存
        reservations:
          cpus: '0.25'     # 保证至少 0.25 个 CPU 核心
          memory: 256M     # 保证至少 256MB 内存
    # MySQL 性能优化配置
    command: >
      --max_connections=50
      --innodb_buffer_pool_size=128M
      --innodb_log_file_size=32M
      --query_cache_size=0
      --query_cache_type=0
      --performance_schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s      # 增加检查间隔，减少资源消耗
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@pmt-mysql:3306/${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      LABELS_EXCEL_PATH: ${LABELS_EXCEL_PATH:-/data/labels/菜单级联关系.xlsx}
      ATTACHMENTS_DIR: /app/attachments
      # 性能优化环境变量
      WORKERS: 2         # 减少 worker 数量
    volumes:
      - attachments:/app/attachments
      - labels-data:/data/labels
    networks:
      - pmt-network
    depends_on:
      mysql:
        condition: service_healthy
    # 资源限制 - Backend
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 限制最多使用 0.5 个 CPU 核心
          memory: 256M     # 限制最多使用 256MB 内存
        reservations:
          cpus: '0.1'      # 保证至少 0.1 个 CPU 核心
          memory: 128M     # 保证至少 128MB 内存
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s      # 增加检查间隔
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"   # 减小日志文件大小
        max-file: "2"    # 减少日志文件数量

  frontend:
    image: nginx:alpine  # alpine 版本更轻量
    container_name: pmt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
    networks:
      - pmt-network
    depends_on:
      - backend
    # 资源限制 - Nginx
    deploy:
      resources:
        limits:
          cpus: '0.25'     # Nginx 很轻量
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mysql-data:
    driver: local
  attachments:
    driver: local
  labels-data:
    driver: local

networks:
  pmt-network:
    driver: bridge
